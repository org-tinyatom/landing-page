        </g>
        <path d="M330 782 L512 278 L694 782" stroke="url(#blue)" stroke-width="94" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="rotate(-14 512 512)">
          <path d="M180 560 A332 104 0 0 0 844 560" stroke="url(#blue)" stroke-width="46" fill="none"/>
        </g>
        <circle cx="846" cy="478" r="42" fill="#a8d8ff"/>
      </g>
    </g>
    <rect width="1024" height="1024" rx="224" ry="224" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="8"/>
