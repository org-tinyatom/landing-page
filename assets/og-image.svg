<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e23"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <radialGradient id="pageGlow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#0f8ce0" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#0f8ce0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0f8ce0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
