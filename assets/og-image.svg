    </linearGradient>
    <radialGradient id="tileGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#0f8ce0" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0f8ce0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect width="1024" height="1024" rx="224" ry="224"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>
  <rect width="1200" height="630" fill="url(#pageGlow)"/>

  <g transform="translate(220,208) scale(0.2)">
